<!DOCTYPE html>
<html>
<head>
    <title>Меняющийся URL</title>
</head>
<body>
    <h1>URL меняется каждую секунду</h1>
    <p>Текущий путь: <span id="pathDisplay">/</span></p>

    <script>
        // Функция генерации случайной строки (буквы и цифры)
        function generateRandomPath(length = 8) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Функция обновления URL
        function updateUrl() {
            // Генерируем случайный путь
            const randomPath = generateRandomPath(6); // например: "adawdkal"
            
            // Меняем URL без перезагрузки страницы
            window.history.pushState({}, '', '/' + randomPath);
            
            // Обновляем отображение на странице (опционально)
            document.getElementById('pathDisplay').textContent = '/' + randomPath;
        }

        // Меняем URL каждую секунду
        setInterval(updateUrl, 1000);
        
        // Чтобы при нажатии "Назад" не ломалось, добавляем обработчик
        window.addEventListener('popstate', function() {
            document.getElementById('pathDisplay').textContent = window.location.pathname;
        });
    </script>
</body>
</html>
