<!DOCTYPE html>
<html>
<head>
    <title>Меняющийся URL (каждые 0.06 сек)</title>
</head>
<body>
    <h1>URL меняется каждые 0.06 секунды ⚡</h1>
    <p>Текущий путь: <span id="pathDisplay">/</span></p>
    <p style="color: gray; font-size: 14px;">Обновлений в секунду: ~16.6</p>

    <script>
        // Функция генерации случайной строки с буквами, цифрами и символами
        function generateRandomPath(length = 8) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789-_.';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Функция обновления URL
        function updateUrl() {
            // Генерируем случайный путь (длина от 5 до 10 символов)
            const length = Math.floor(Math.random() * 6) + 5;
            const randomPath = generateRandomPath(length);
            
            // Меняем URL без перезагрузки страницы
            window.history.pushState({}, '', '/' + randomPath);
            
            // Обновляем отображение на странице
            document.getElementById('pathDisplay').textContent = '/' + randomPath;
        }

        // 0.06 секунды = 60 миллисекунд
        setInterval(updateUrl, 60);
        
        // Обработчик для кнопки "Назад"
        window.addEventListener('popstate', function() {
            document.getElementById('pathDisplay').textContent = window.location.pathname;
        });
    </script>
</body>
</html>
